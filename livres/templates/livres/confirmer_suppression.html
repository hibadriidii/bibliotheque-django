{% extends 'base.html' %}
{% block title %}Supprimer — {{ livre.titre }}{% endblock %}
{% block content %}
<div style="max-width:480px;margin:4rem auto;text-align:center">
  <div class="carte">
    <div style="font-size:2rem;color:var(--rouge);margin-bottom:1rem">⚠</div>
    <h2 style="font-family:'IM Fell English',serif;color:var(--brun);font-size:1.4rem;margin-bottom:.75rem">Confirmer la suppression</h2>
    <p style="font-family:'Cormorant Garamond',serif;color:var(--brun2);margin-bottom:.5rem">Vous êtes sur le point de retirer du catalogue :</p>
    <p style="font-family:'Cormorant Garamond',serif;font-style:italic;color:var(--or);font-size:1.15rem;margin-bottom:1.5rem">« {{ livre.titre }} »</p>
    <p style="font-family:'Cormorant Garamond',serif;font-style:italic;color:var(--brun2);font-size:.9rem;margin-bottom:2rem">Cette action est définitive et irréversible.</p>
    <form method="post" style="display:flex;gap:12px;justify-content:center">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger">✕ Supprimer définitivement</button>
      <a href="{% url 'liste_livres' %}" class="btn btn-contour">← Annuler</a>
    </form>
  </div>
</div>
{% endblock %}
