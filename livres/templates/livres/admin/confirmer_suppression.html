{% extends 'base.html' %}
{% block title %}Retirer {{ livre.titre }}{% endblock %}
{% block content %}
<div style="max-width:500px;margin:4rem auto;text-align:center">
  <div style="background:white;border:1px solid var(--parchemin3);border-top:3px solid var(--rouge2);border-radius:var(--radius);padding:3rem;box-shadow:var(--ombre2)">
    <div style="font-size:3rem;margin-bottom:1.2rem;opacity:.6">⚠️</div>
    <h2 style="font-family:'Cinzel',serif;font-size:1.2rem;letter-spacing:.1em;margin-bottom:.8rem">RETIRER CE VOLUME</h2>
    <p style="font-family:'EB Garamond',serif;font-style:italic;color:var(--encre3);margin-bottom:.8rem">
      Vous êtes sur le point de retirer définitivement :
    </p>
    <p style="font-family:'Cormorant Garamond',serif;font-size:1.3rem;font-style:italic;color:var(--encre);margin-bottom:.4rem">« {{ livre.titre }} »</p>
    <p style="font-size:.85rem;color:var(--encre3);font-style:italic;margin-bottom:2rem">par {{ livre.auteur }}</p>
    <p style="font-size:.82rem;color:var(--rouge);margin-bottom:2rem;font-family:'Cinzel',serif;letter-spacing:.05em">CETTE ACTION EST IRRÉVERSIBLE</p>
    <form method="post" style="display:flex;gap:12px;justify-content:center">
      {% csrf_token %}
      <button type="submit" class="btn btn-rouge">Retirer définitivement</button>
      <a href="{% url 'liste_livres' %}" class="btn btn-outline">Annuler</a>
    </form>
  </div>
</div>
{% endblock %}
